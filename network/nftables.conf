#!/usr/sbin/nft -f
# Только для отдельной VM-шлюза: текущие правила будут заменены.
# Если интерфейсы называются иначе, замени ens33 (WAN) и ens37 (LAN).
flush ruleset

table inet lab_router {
  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state invalid drop
    ct state established,related accept
    iifname "ens37" oifname "ens33" ip saddr 192.168.76.0/24 accept
    # Разрешаем входящий трафик, который прошёл через DNAT ниже.
    iifname "ens33" oifname "ens37" ip daddr 192.168.76.21 tcp dport 30080 ct status dnat accept
  }
}

table ip lab_nat {
  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    # Для входа через WAN шлюза на порт 8080 раскомментируй строку:
    # iifname "ens33" tcp dport 8080 dnat to 192.168.76.21:30080
  }

  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    ip saddr 192.168.76.0/24 oifname "ens33" masquerade
  }
}
