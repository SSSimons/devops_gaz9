apiVersion: v1
kind: Namespace
metadata:
  name: service-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-lab
  namespace: service-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-lab
  template:
    metadata:
      labels:
        app: service-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        sysctls:
          - name: net.ipv4.ping_group_range
            value: "10001 10001"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: service-lab:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_RAW]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: service-lab
  namespace: service-lab
spec:
  type: ClusterIP
  selector:
    app: service-lab
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: service-lab
  namespace: service-lab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: app.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-lab
                port:
                  number: 80
